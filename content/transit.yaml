# Bus und Bahn: Fahrplandaten aus dem offenen deutschlandweiten GTFS-Datensatz
# (DELFI e.V., bereitgestellt von gtfs.de, Lizenz CC BY 4.0), dazu Verspätungen und Ausfälle
# aus dem Echtzeit-Datenstrom von gtfs.de (Lizenz CC BY-SA 4.0).
# Bus and train: timetable from the open German GTFS feed, plus delays from the gtfs.de real-time feed.

# Der Gesamt-Datensatz: nur er enthält neben Bus und Stadtbahn auch S-Bahn, RE und RB, und nur zu
# ihm passen die Fahrt-IDs des Echtzeit-Datenstroms. / The full feed: the local-only feed (nv_free)
# has no S-Bahn or regional trains, and the real-time feed's trip ids belong to the full feed.
gtfsUrl: https://download.gtfs.de/germany/free/latest.zip
attribution: "Fahrplandaten: DELFI e.V. über gtfs.de, CC BY 4.0"
attributionUrl: https://gtfs.de/
# Wie oft der Datensatz (mehrere hundert MB) neu geladen wird. Die Echtzeitdaten passen nur zum
# aktuellen Datensatz, deshalb täglich. / Refresh daily so real-time trips match the timetable.
refreshDays: 1
# Wie viele Tage im Voraus Abfahrten berechnet werden.
daysAhead: 3
# Mindest-Umstiegszeit am Bahnhof in Minuten.
transferMinutes: 4
# Längste Wartezeit auf den Anschluss in Minuten.
maxWaitMinutes: 60

# Echtzeit: Verspätungen und Ausfälle, alle intervalSeconds Sekunden abgerufen.
# Der Datenstrom gilt für ganz Deutschland und ist mehrere MB groß; nachts (quietHours) Pause.
# Real-time delays and cancellations. The feed covers all of Germany and is several MB per request.
realtime:
  enabled: true
  url: https://realtime.gtfs.de/realtime-free.pb
  intervalSeconds: 120
  quietHours: [1, 4]
  attribution: "Echtzeitdaten: gtfs.de, CC BY-SA 4.0"
  attributionUrl: https://gtfs.de/de/realtime/

# Mittelpunkt von Geyen; Haltestellen werden in diesem Umkreis gesucht.
center: { lat: 50.9817, lon: 6.7864 }

# Haltestellen in Geyen: alle Haltestellen im Umkreis, deren Name eines dieser Wörter enthält.
stops:
  match: [geyen]
  radiusKm: 2
  # Link zur Live-Abfahrtstafel des VRS je Haltestelle (Name wie im Fahrplan).
  liveLinks:
    Geyen Mitte: https://www.vrs.de/his/haltestelle/de:05362:81741
  defaultLiveLink: https://www.vrs.de/

# Umstiegspunkte nach Köln. Ein Name passt, wenn er genau in names steht oder alle Wörter einer
# Gruppe enthält. Der Bahnhof heißt im Fahrplan oft nur "Pulheim", die Bushaltestelle "Pulheim Bahnhof".
hubs:
  - name: Pulheim Bahnhof
    names: [Pulheim]
    match: [[pulheim, bahnhof], [pulheim, bf]]
  - name: Köln-Weiden West
    match: [[weiden, west]]
# Umstiegspunkte und Ziele werden in diesem Umkreis um Geyen gesucht.
radiusKm: 30

# Ziele in Köln (das erste erreichbare zählt).
destinations:
  - name: Köln Hbf
    match: [[köln, hbf], [köln, hauptbahnhof]]
  - name: Köln Neumarkt
    match: [[köln, neumarkt]]
