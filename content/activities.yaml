# Die Seite zeigt automatisch nur kommende Flohmarkt-Termine und nur Orte im Umkreis von radiusKm
# um center (Luftlinie). Vergangene Termine verschwinden beim nächsten Neubau von selbst.
# lat/lon: ungefähre Lage (reicht für die Entfernung); bei neuen Einträgen z. B. von openstreetmap.org.
