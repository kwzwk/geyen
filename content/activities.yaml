# Wöchentlich gelesene Flohmarkt-Termine (Veranstaltungskalender von koeln.de, nur Datum, Titel, Ort, Link).
# Ergänzt die Liste oben; doppelte Termine (gleiches Datum, gleiche Straße) zeigt die Seite nur einmal.
# Weekly flea market dates from koeln.de's events calendar API. Adds to the list above; duplicates
# (same date and street) are shown once. Set refreshDays to change the schedule.
marketFeed:
  name: koeln.de
  api: https://www.koeln.de/wp-json/tribe/events/v1/events
  search: [Flohmarkt, Trödelmarkt]
  refreshDays: 7
  daysAhead: 70

